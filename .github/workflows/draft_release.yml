name: Prepare release bundle (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_COMMIT: ${{ github.sha }}

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Build reviewable archive, provenance and rollback instructions
        run: python scripts/build_candidate.py
      - uses: actions/upload-artifact@v4
        with:
          name: bose-release-review-${{ github.sha }}
          path: dist/
          if-no-files-found: error
