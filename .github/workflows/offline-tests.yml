name: Offline integration tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install test dependencies and declared integration requirements
        run: |
          python -m pip install -r tests/requirements.txt
          python - <<'PY'
          import json, subprocess, sys
          requirements = json.load(open("custom_components/bose/manifest.json"))["requirements"]
          subprocess.check_call([sys.executable, "-m", "pip", "install", *requirements])
          PY
      - name: Run all integration unit tests without network sockets
        run: python -m pytest tests --disable-socket --allow-unix-socket --timeout=10 --junitxml=junit/integration.xml -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-unit-results
          path: junit/integration.xml
